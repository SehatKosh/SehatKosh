name: SehatKosh Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs on the same branch (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Frontend — lint, typecheck, build verification
  # ============================================================
  frontend-quality:
    name: Frontend — Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.7.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turborepo Lint
        run: pnpm turbo run lint

      - name: TypeScript Type Check (Doctor Web)
        run: pnpm --filter @sehatkosh/doctor-web exec tsc --noEmit

      - name: Verify Doctor Web Production Build
        run: pnpm --filter @sehatkosh/doctor-web build

  # ============================================================
  # Job 2: Backend — lint, pytest (tests exist from Phase 1)
  # Adjustment #1: CI only activates because tests/conftest.py,
  # tests/test_ocr.py, tests/test_fhir.py already exist.
  # ============================================================
  backend-tests:
    name: Backend — Flake8 Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd services/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flake8 — Critical Errors Only
        run: |
          cd services/backend
          flake8 app/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Pytest — Full Test Suite
        run: |
          cd services/backend
          pytest -v --tb=short
        env:
          OCR_ENGINE: mock
          FHIR_PARSER: mock
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: "postgresql+asyncpg://user:pass@localhost:5432/testdb"
          NEO4J_URI: "bolt://localhost:7687"
          NEO4J_USER: "neo4j"
          NEO4J_PASSWORD: "password"
          AWS_ENDPOINT_URL: "http://localhost:4566"
          AWS_ACCESS_KEY_ID: "mock_key"
          AWS_SECRET_ACCESS_KEY: "mock_secret"
          AWS_DEFAULT_REGION: "ap-southeast-1"
          S3_BUCKET_NAME: "sehatkosh-prescriptions"
